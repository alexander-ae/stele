stages:
  - check

check:
  stage: check
  image: rust:1.99
  interruptible: true
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
  cache:
    key: "rust-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - target/
  before_script:
    - rustup component add rustfmt clippy
  script:
    - rustc --version
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    # The release profile (fat LTO) is the artifact people install, so it is
    # built too; the tests above run in the debug profile to keep the job short.
    - cargo build --release
