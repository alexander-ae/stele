[package]
name = "stele"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "A mailbox between coding agents, with anathem as the archive"
repository = "https://gitlab.com/__alexander__/stele"
readme = "README.md"

[dependencies]
anyhow = "1"
getrandom = "0.4"
httparse = "1"
lexopt = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
